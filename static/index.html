<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5F8;--surface:#FFFFFF;--ink:#1A2233;--muted:#667085;--line:#DCE0E8;--accent:#27408B;--mark:#FFE27A;--markink:#3B3200;--err:#9B1C1C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{margin:0;font:500 21px "Newsreader",Georgia,serif}
#meta{color:var(--muted);font-size:14px}
main{flex:1;overflow-y:auto}
#thread{max-width:720px;margin:0 auto;padding:28px 20px 12px}
.turn{margin:0 0 28px}
.user{display:flex;justify-content:flex-end}
.user p{max-width:85%;margin:0;padding:10px 14px;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.bot{padding-left:16px;border-left:3px solid var(--accent);font:400 18px/1.65 "Newsreader",Georgia,serif}
.bot p{margin:0 0 .8em}
.bot ul,.bot ol{margin:0 0 .8em;padding-left:1.3em}
.bot.error{border-color:var(--err);color:var(--err);font:400 16px/1.5 "Instrument Sans",sans-serif}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font:500 13px "Instrument Sans",sans-serif}
.chip{padding:2px 8px;background:var(--mark);color:var(--markink);border-radius:4px}
.empty{padding:36px 0 8px}
.empty h2{margin:0 0 6px;font:500 30px/1.2 "Newsreader",Georgia,serif}
.empty p{margin:0 0 22px;max-width:46ch;color:var(--muted)}
.suggest{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.suggest button{padding:9px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;text-align:left;cursor:pointer}
.suggest button:hover{border-color:var(--accent)}
.dots i{display:inline-block;width:7px;height:7px;margin-right:5px;background:var(--muted);border-radius:50%;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
footer{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
#composer{display:flex;gap:10px;align-items:flex-end;max-width:720px;margin:0 auto}
textarea{flex:1;resize:none;max-height:160px;padding:11px 14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit}
#send{padding:11px 20px;background:var(--accent);color:#fff;border:0;border-radius:10px;font:600 15px "Instrument Sans",sans-serif;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<header>
  <h1 id="name">Document assistant</h1>
  <span id="meta"></span>
</header>
<main id="scroller"><div id="thread"></div></main>
<footer>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="Ask a question about your documents" aria-label="Your question"></textarea>
    <button id="send" type="button">Send</button>
  </div>
</footer>

<script>
// Edit these two to rename the bot and change the starter questions.
const BOT_NAME = "Document assistant";
const SUGGESTIONS = [
  "Summarize the main points",
  "What are the key terms or definitions?",
  "What should I read first?"
];

const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("input"), sendBtn = $("send"), scroller = $("scroller");
const history = [];
let busy = false;

$("name").textContent = BOT_NAME;
document.title = BOT_NAME;

fetch("/api/health").then(r => r.json()).then(h => {
  $("meta").textContent = h.chunks ? `${h.chunks} passages indexed from your PDFs` : "No PDFs indexed yet";
}).catch(() => {});

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

function md(text) {
  return text.split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*[-*]\s+/.test(l)))
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l)))
      return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    return "<p>" + inline(lines.join("\n")).replace(/\n/g, "<br>") + "</p>";
  }).join("");
}

function showEmpty() {
  const el = document.createElement("div");
  el.className = "empty";
  el.id = "empty";
  el.innerHTML = "<h2>Ask about your documents</h2><p>Answers come only from the PDFs you added, with the page each one came from.</p>";
  const list = document.createElement("div");
  list.className = "suggest";
  SUGGESTIONS.forEach(q => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.onclick = () => send(q);
    list.appendChild(b);
  });
  el.appendChild(list);
  thread.appendChild(el);
}

function addUser(text) {
  const t = document.createElement("div");
  t.className = "turn user";
  const p = document.createElement("p");
  p.textContent = text;
  t.appendChild(p);
  thread.appendChild(t);
}

function addBot(html) {
  const t = document.createElement("div");
  t.className = "turn";
  const b = document.createElement("div");
  b.className = "bot";
  b.innerHTML = html;
  t.appendChild(b);
  thread.appendChild(t);
  return b;
}

const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

function resize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  const empty = $("empty");
  if (empty) empty.remove();

  history.push({ role: "user", content: text });
  addUser(text);
  input.value = "";
  resize();
  const bot = addBot('<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>');
  toBottom();

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Request failed");
    history.push({ role: "assistant", content: d.answer });
    bot.innerHTML = md(d.answer);
    if (d.sources && d.sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      d.sources.forEach(x => {
        const c = document.createElement("span");
        c.className = "chip";
        c.textContent = `${x.source}, p.${x.page}`;
        s.appendChild(c);
      });
      bot.appendChild(s);
    }
  } catch (e) {
    history.pop();
    bot.className = "bot error";
    bot.textContent = `Couldn’t get an answer: ${e.message}. Check your API key and try again.`;
  }
  busy = false;
  sendBtn.disabled = false;
  input.focus();
  toBottom();
}

sendBtn.onclick = () => send(input.value);
input.addEventListener("input", resize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});

showEmpty();
</script>
</body>
</html>
